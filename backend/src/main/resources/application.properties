# Server Configuration
server.port=${SERVER_PORT:8081}

# Application Name
spring.application.name=PlacePro

# Supabase PostgreSQL Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Google OAuth Configuration
# Must match the Web Client ID from Google Cloud Console (APIs & Services > Credentials).
# Frontend VITE_GOOGLE_CLIENT_ID must be the SAME value.
# Note: client SECRET is not used for ID-token verification (frontend @react-oauth/google
# sends an ID token, backend verifies signature/audience). Do not add it here.
google.client.id=${GOOGLE_CLIENT_ID:}

# CORS Configuration
# Comma-separated list; override with APP_CORS_ALLOWED_ORIGINS env var in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
